name: CPU tests

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/requirements-dev.txt
      - name: Install core and test dependencies
        run: python -m pip install -r code/requirements-dev.txt
      - name: Compile modules and tests
        run: python -m compileall -q code/modules code/tests
      - name: Run CPU tests (no GPU or model downloads)
        working-directory: code
        run: >-
          python -m pytest -q
          tests/test_data_helper.py
          tests/test_deep_helper.py
          tests/test_eval_helper.py
          tests/test_explain_helper.py
          tests/test_features.py
          tests/test_models.py
          tests/test_results_helper.py
          tests/test_runs.py
